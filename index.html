<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* 移动壳分流：手机形态默认去 /mobile.html，两端都能手动切回且不会被弹回。
   偏好键 planner.ui 与业务状态无关；不做 UA 嗅探，只用宽度+指针类型判据。 */
(function(){
  var pref="";try{pref=localStorage.getItem("planner.ui")||""}catch(e){}
  var phone=matchMedia("(max-width:760px) and (pointer:coarse)").matches;
  if(pref==="desktop")return;
  /* 必须同时带上 query 和 hash：Supabase 邮箱链接/OAuth 回调把授权码放在 query string，
     只保 hash 会让手机上的这两类登录静默失败 */
  if(pref==="mobile"||phone)location.replace("/mobile.html"+location.search+location.hash);
})();
</script>
<title>手帐风 · 日程管理</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --radius:10px;
  --ink:#26231f;
  --paper:#f7f3ec;
  --card:#fffdf8;
  --line:#d8d2c6;
  --accent:#e8683c;      /* 珊瑚橘 */
  --accent-soft:#fbe9e0;
  --cream:#fff6ea;
  --muted:#8a8177;
  --banner-bg:#26231f;
  --banner-fg:#fdfaf4;
  --tag-bg:#26231f;
  --tag-fg:#fdfaf4;
  --grid-line:#e6dfd2;
  --shadow:0 1px 3px rgba(60,50,40,.08);
  /* 四象限优先级色：色相与明度双重拉开，保证小圆点也可分辨 */
  --p1:#c0362c;  /* 深砖红 · 重要紧急 */
  --p2:#e8912a;  /* 琥珀橙 · 重要不紧急 */
  --p3:#2e7db7;  /* 钢蓝 · 紧急不重要 */
  --p4:#9aa3ad;  /* 中性灰 · 不紧急不重要 */
  /* 逾期标识：与 --p1 砖红 ΔE76=29.0、与 --accent 珊瑚橘 ΔE76=43.0，同排不混淆 */
  --overdue:#8c2f39;
  --overdue-soft:#f6e9ec;
  /* 迟完留痕：与同行 P2 琥珀橙 ΔE76=34（最近的一个），与逾期酒红拉开 51 */
  --late:#8a6a12;
  --late-soft:#fbf5e7;  /* 金字在其上 4.65:1；旧值 #f7efdb 只有 4.41:1 不达 AA */
  /* 日历「休/班」日期下方纯文本标（对齐用户参考截图）。休红实测：卡底对比度 5.23 过 AA，ΔE76 距 P1 砖红 15、逾期酒红 16.4（更暗则不达 AA，此红偏玫瑰与砖红橙调可辨）；班靛蓝：对比度 5.6，距各蓝紫 ≥25.7 */
  --holiday:#b84444;
  --off-tint:#f9ece9;  /* 休/周末淡粉底（较初版加深一档） */
  --mk-tint:#eae7df;   /* 班淡灰底 */
  /* 方块字标白字对比实测：休 #b84444=5.32、班 #7a7168=4.78、末 #b96a63=3.96（小面积装饰块，末达非文本 AA） */
}
body.theme-i{
  --ink:#2c3140;
  --paper:#f2f3f7;
  --card:#fdfdfe;
  --line:#ccd2de;
  --accent:#6b83a8;      /* 雾霾蓝 */
  --accent-soft:#e3e9f3;
  --cream:#f4f2fa;       /* 淡薰衣草底 */
  --muted:#7d8496;
  --banner-bg:#2c3140;
  --banner-fg:#f4f5fa;
  --tag-bg:#2c3140;
  --tag-fg:#f4f5fa;
  --grid-line:#dde1ea;
  --shadow:0 1px 3px rgba(50,60,90,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important} /* label/auth-user 的 display 会覆盖 hidden 属性，需强制 */
html{font-size:15px}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px),
    linear-gradient(var(--paper),var(--paper));
  background-size:22px 22px,100% 100%;
  transition:background-color .45s ease,color .45s ease;
  min-height:100vh;
}
body,button,input,select,textarea{transition:background-color .45s ease,color .45s ease,border-color .45s ease}
h1,h2,h3{font-weight:700}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* ============ 顶部 ============ */
header{max-width:1440px;margin:0 auto;padding:18px 16px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;stroke:var(--accent)}
.brand h1{font-size:1.25rem;letter-spacing:.05em}
.brand .sub{font-size:.72rem;color:var(--muted);letter-spacing:.2em}
.theme-toggle{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.theme-toggle button{border:none;background:transparent;padding:7px 16px;font-size:.82rem;color:var(--ink);display:flex;align-items:center;gap:6px}
.theme-toggle button.active{background:var(--ink);color:var(--paper)}
.theme-toggle svg{width:14px;height:14px}

nav.views{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:thin}
nav.views button{
  flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:7px 18px;font-size:.85rem;display:flex;align-items:center;gap:6px;
}
nav.views button svg{width:15px;height:15px}
nav.views button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 筛选条 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 2px 10px}
.filters label{
  font-size:.72rem;font-weight:700;letter-spacing:.04em;line-height:1;
  display:inline-flex;align-items:center;gap:5px;
  background:var(--accent-soft);color:var(--accent);
  padding:3px 10px;border-radius:999px;
}
.filters label svg{width:12px;height:12px}
.filters select,.filters input[type="search"]{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:8px;padding:5px 8px;font-size:.8rem;
}
.filters input[type="search"]{width:200px;max-width:100%;min-width:0}
.filters input[type="search"]::placeholder{color:var(--muted)}
.filters input[type="search"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters .reset{
  display:inline-flex;align-items:center;gap:6px;
  border:1.5px dashed var(--line);background:transparent;color:var(--ink);
  border-radius:999px;padding:5px 14px;font-size:.78rem;font-weight:600;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.filters .reset svg{width:13px;height:13px;flex:0 0 auto}
.filters .reset:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters .reset:active{transform:translateY(1px)}
.filters .reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{
  background:var(--banner-bg);color:var(--banner-fg);border-radius:var(--radius);
  padding:9px 16px;font-size:.85rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 14px;
}
.banner-summary{flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
.banner svg{width:15px;height:15px;flex:0 0 auto}
.banner b{color:var(--accent)}
body.theme-i .banner b{color:#a9c3e8}

/* ============ 布局与卡片 ============ */
main{max-width:1440px;margin:0 auto;padding:0 16px 60px}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.card h3{
  font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;
  border-left:4px solid var(--accent);padding-left:8px;
}
.card h3 svg{width:16px;height:16px;stroke:var(--accent)}
.tag{
  display:inline-block;background:var(--tag-bg);color:var(--tag-fg);
  font-size:.68rem;padding:2px 8px;border-radius:999px;letter-spacing:.05em;white-space:nowrap;
}
.tag.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* 任务条目 */
.task-item{
  border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px;
  background:var(--card);display:flex;align-items:flex-start;gap:10px;position:relative;
}
.task-item.done{opacity:.62}
.task-item.done .t-title{text-decoration:line-through}
.task-item .chk{
  width:18px;height:18px;border:1.5px solid var(--ink);border-radius:5px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;background:transparent;margin-top:2px;
}
.task-item .chk svg{width:12px;height:12px;stroke:var(--accent);display:none}
.task-item.done .chk svg{display:block}
.task-item .t-body{flex:1;min-width:0}
.task-item .t-title{font-size:.88rem;font-weight:600}
.task-item .t-meta{font-size:.72rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.task-item .t-acts{display:flex;gap:4px;flex:0 0 auto}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:13px;height:13px}
.prio-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;margin-top:6px}
.p1{background:var(--p1)}.p2{background:var(--p2)}.p3{background:var(--p3)}.p4{background:var(--p4)}
.progress-bar{height:5px;background:var(--grid-line);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.status-pill{font-size:.68rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.st-todo{color:var(--muted)}
.st-doing{color:var(--accent);border-color:var(--accent)}
.st-done{color:#3f8f5f;border-color:#3f8f5f}
.badge-overdue{
  display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:600;
  padding:1px 7px;border-radius:999px;border:1.2px solid var(--overdue);
  color:var(--overdue);background:var(--card);white-space:nowrap;letter-spacing:.02em;
}
.badge-overdue svg{width:10px;height:10px;stroke:var(--overdue);flex:0 0 auto}
.badge-late{
  display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:600;
  padding:1px 7px;border-radius:999px;border:1.2px solid var(--late);
  color:var(--late);background:var(--card);white-space:nowrap;letter-spacing:.02em;
}
.badge-late svg{width:10px;height:10px;stroke:var(--late);flex:0 0 auto}
.banner-tail{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.ontime-strip{font-size:.74rem;line-height:1.7;color:var(--ink);background:var(--cream);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.ontime-strip b{color:var(--accent)}
.late-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--late-soft);color:var(--late);border:1.2px solid var(--late);
  border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600;font-family:inherit;
}
.late-chip svg{width:12px;height:12px;stroke:var(--late)}
.late-chip.clear{background:transparent;color:var(--banner-fg);border-color:rgba(253,250,244,.32)}
.late-chip.clear svg{stroke:var(--banner-fg)}
.late-chip:hover:not(.clear):not(.on){background:#fff}
.late-chip.on{background:var(--late);color:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.late-chip.on svg{stroke:#fff}
.overdue-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--overdue-soft);color:var(--overdue);border:1.2px solid var(--overdue);
  border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600;font-family:inherit;
}
.overdue-chip svg{width:12px;height:12px;stroke:var(--overdue)}
.overdue-chip.clear{background:transparent;color:var(--banner-fg);border-color:rgba(253,250,244,.32)}
.overdue-chip.clear svg{stroke:var(--banner-fg)}
.overdue-chip:hover:not(.clear):not(.on){background:#fff}
.undo-bar{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;
  display:none;align-items:center;gap:14px;max-width:calc(100vw - 32px);
  background:var(--banner-bg);color:var(--banner-fg);border-radius:999px;padding:10px 12px 10px 20px;
  box-shadow:0 8px 28px rgba(30,25,20,.3);font-size:.85rem;animation:undoIn .18s ease;
}
.undo-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo-bar button{
  flex:0 0 auto;background:var(--accent);color:#fff;border:1.5px solid var(--accent);
  border-radius:999px;padding:5px 16px;font-size:.8rem;font-weight:700;font-family:inherit;cursor:pointer;
}
.undo-bar button:hover{filter:brightness(.9)}
@keyframes undoIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* 批量选择：仅日视图生效，退出模式后列表外观零变化 */
#view-day.bulk-mode .task-item .chk,#view-day.bulk-mode .task-item .t-acts{display:none}
.task-item .bulk-chk{width:15px;height:15px;flex:0 0 auto;accent-color:var(--accent);cursor:pointer;margin-top:2px}
.bulk-bar label{display:flex;align-items:center;gap:5px;font-size:.8rem;flex:0 0 auto;cursor:pointer}
.bulk-bar #bulkDel{background:var(--overdue);border-color:var(--overdue)}
.bulk-bar .bulk-exit{background:transparent;color:var(--banner-fg);border-color:rgba(253,250,244,.32)}
.bulk-bar button:disabled{opacity:.45;cursor:default;filter:none}
.overdue-chip.on{background:var(--overdue);color:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.overdue-chip.on svg{stroke:#fff}

/* 循环任务 */
.badge-recur{
  display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:600;
  padding:1px 7px;border-radius:999px;border:1.2px solid var(--accent);
  color:var(--accent);background:var(--card);white-space:nowrap;letter-spacing:.02em;
}
.badge-recur svg{width:10px;height:10px;stroke:var(--accent);flex:0 0 auto}
.mini-task.recur{border-left:3px dashed var(--accent);background:var(--card)}
.recur-days{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.recur-days label{
  display:flex;align-items:center;gap:4px;font-size:.76rem;border:1.5px solid var(--line);
  border-radius:7px;padding:4px 9px;cursor:pointer;background:var(--paper);
}
.recur-days label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.recur-days input{accent-color:var(--accent)}
.recur-hint{font-size:.7rem;color:var(--muted);line-height:1.6}
.recur-stat{font-size:.7rem;color:var(--muted);margin-top:4px}
.recur-stat b{color:var(--accent)}
.recur-stat .streak{color:#3f8f5f;font-weight:600}

/* 统计 */
.stat-num{font-size:1.6rem;font-weight:800;color:var(--accent)}
.stat-label{font-size:.72rem;color:var(--muted);margin-top:2px}
.stat-box{text-align:center;padding:10px 4px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 课表 */
.timetable-wrap{overflow-x:auto}
table.timetable{border-collapse:collapse;width:100%;min-width:760px}
table.timetable th,table.timetable td{border:1px solid var(--grid-line);font-size:.72rem;vertical-align:top}
table.timetable th{background:var(--cream);padding:7px 4px;font-size:.75rem;text-align:center}
table.timetable td.time-col{background:var(--cream);text-align:center;padding:6px 4px;color:var(--muted);white-space:nowrap;width:74px}
table.timetable td.cell{height:34px;padding:2px;position:relative}
.course-block{
  border:1.5px solid var(--accent);border-radius:7px;background:var(--accent-soft);
  padding:5px 7px;font-size:.7rem;margin:2px;cursor:pointer;line-height:1.45;
}
.course-block b{font-size:.74rem;display:block}
.course-block .meta{color:var(--muted)}

/* 日视图 */
.day-layout{display:grid;grid-template-columns:300px 1fr 280px;gap:14px}
.day-layout>div{display:flex;flex-direction:column}
/* 各列末卡撑满列高，使三列底边对齐（列高由最高列决定） */
.day-layout>div>.card:last-child{flex:1;display:flex;flex-direction:column}
.day-layout>div>.card:last-child .goal-empty{margin:auto 0}
@media(max-width:1000px){.day-layout{grid-template-columns:1fr}}
.clock{font-size:1.9rem;font-weight:800;letter-spacing:.06em;color:var(--accent);font-variant-numeric:tabular-nums}
.mini-cal{width:100%;border-collapse:collapse;font-size:.72rem}
.mini-cal th,.mini-cal td{text-align:center;padding:4px 2px}
.mini-cal th{color:var(--muted);font-weight:600}
.mini-cal td{border-radius:6px;cursor:pointer}
.mini-cal td.today{background:var(--accent);color:#fff;font-weight:700}
.mini-cal td.sel{outline:1.5px solid var(--accent)}
.mini-cal td.has-task{font-weight:700;text-decoration:underline;text-decoration-color:var(--accent)}
.mini-cal td.past{color:var(--muted);opacity:.6}
.mini-cal td.past.has-task{text-decoration-color:var(--muted)}
/* 数字+休/班字标同一行（flex 保证所有格子基线一致，字标不再把数字挤下行）；月视图左对齐 */
.dtop{display:flex;justify-content:center;align-items:baseline;white-space:nowrap}
.day-cell .dtop{justify-content:flex-start}
/* 日视图小日历加宽版（对齐参考图）：数字加大、上下留白、周行间细分隔线；休/班悬浮格子左上角，数字保持居中同行 */
.mini-cal-wide{font-size:.92rem;table-layout:fixed}
.mini-cal-wide th{padding:9px 2px 6px}
.mini-cal-wide td{padding:6px 2px 0;border-bottom:1px solid var(--grid-line);font-weight:700;position:relative}
.mini-cal-wide tr:last-child td{border-bottom:none}
.mini-cal-wide .dmark{position:absolute;top:4px;left:5px;margin:0}
/* 假日/周末淡粉底、补班淡灰底；today 橙底优先不被覆盖 */
.mini-cal-wide td.off:not(.today),.mini-cal-wide td.wkend:not(.today){background:var(--off-tint)}
.mini-cal-wide td.mk:not(.today){background:var(--mk-tint)}
.day-cell.off,.day-cell.wkend{background:var(--off-tint)}
.day-cell.mk{background:var(--mk-tint)}
.mini-cal-wide .dname{height:1.6em;line-height:1.6;font-size:.66rem;font-weight:400}
/* 日历日格：休/班/末为白字实心小方块（实测白字对比 休5.32/班4.78/末3.96）；数字下信息行每格恒在，行距均匀。
   节气绿 #3f7d70 实测卡底对比度 4.72 过 AA；假期/节日红复用 --holiday */
.dmark{display:inline-block;min-width:1.2em;height:1.2em;line-height:1.2;font-size:.62rem;font-weight:600;text-align:center;border-radius:2px;color:#fff;margin-right:3px;vertical-align:.1em}
.dmark.off{background:var(--holiday)}
.dmark.work{background:#7a7168}
.dmark.wkend{background:#b96a63}
.dname{display:block;height:1.2em;line-height:1.2;font-size:.52rem;text-align:center;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dname.n-hol{color:var(--holiday)}
.dname.n-term{color:#3f7d70}
.day-cell .dnum{display:block}
.day-cell .dname{text-align:left}
.year-month .dname{display:none} /* 年视图格子太小，不显信息行 */
.cal-head{gap:4px}

        </button>
        <button id="authOAuthGithub" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.29-1.69-1.29-1.69-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.72 1.27 3.39.97.1-.75.4-1.27.73-1.56-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.21.66.79.55A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
          使用 GitHub 登录
        </button>
      </div>
      <p class="auth-message" id="authMessage" aria-live="polite"></p>
      <p class="auth-foot">登录后，日程与目标将安全同步到你的账户</p>
    </div>
  </section>

<header>
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M8 14l2.5 2.5L16 12"/></svg>
      <div>
        <h1>手帐风 · 日程管理</h1>
        <div class="sub">JOURNAL PLANNER</div>
      </div>
    </div>
    <div class="auth-user" id="authUser" hidden>
      <span id="authUserEmail"></span>
      <button id="signOut" type="button">退出登录</button>
    </div>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme="e" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>E 人 · 明快</button>
      <button data-theme="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>I 人 · 安静</button>
    </div>
    <!-- 手动切到移动壳；写入偏好后 head 里的分流脚本不再自动跳转 -->
    <button id="toMobile" onclick="try{localStorage.setItem('planner.ui','mobile')}catch(e){};location.href='/mobile.html'" style="border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.78rem;font-family:inherit;cursor:pointer">手机版</button>
  </div>
  <nav class="views" id="viewNav"></nav>
  <div class="filters" id="filterBar">
    <label for="fKeyword"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</label>
    <input type="search" id="fKeyword" placeholder="标题 / 拼音首字母" aria-label="按任务标题或拼音首字母搜索" title="支持中文、英文及拼音首字母，例如 xzb 搜索写周报" autocomplete="off">
    <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>筛选</label>
    <select id="fYear"></select>
    <select id="fMonth"><option value="">全部月份</option></select>
    <select id="fPrio"><option value="">全部优先级</option><option value="1">P1 重要紧急</option><option value="2">P2 重要不紧急</option><option value="3">P3 紧急不重要</option><option value="4">P4 不紧急不重要</option></select>
    <select id="fStatus"><option value="">全部状态</option><option value="todo">未开始</option><option value="doing">进行中</option><option value="done">已完成</option></select>
    <select id="fType"><option value="">全部类型</option></select>
    <select id="fSlot"><option value="">全部时间段</option><option value="morning">早晨 6-12</option><option value="afternoon">下午 12-18</option><option value="evening">晚间 18-24</option></select>
    <button class="reset" id="fReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>重置筛选</button>
  </div>
  <div class="banner" id="banner"></div>
</header>
<main>
  <section class="view" id="view-schedule"></section>
  <section class="view" id="view-day"></section>
  <section class="view" id="view-week"></section>
  <section class="view" id="view-month"></section>
  <section class="view" id="view-mprogress"></section>
  <section class="view" id="view-year"></section>
  <section class="view" id="view-kanban"></section>
</main>

<!-- 任务编辑弹窗 -->
<div class="modal-mask" id="taskModal">
  <div class="modal">
    <h3 id="tmTitle">编辑任务</h3>
    <div class="form-row full"><div><label>任务标题</label><input id="tTitle" placeholder="输入任务名称"></div></div>
    <div class="form-row">
      <div><label>任务类型</label><select id="tType"></select></div>
      <div><label>优先级</label><select id="tPrio"><option value="1">P1 重要紧急</option><option value="2">P2 重要不紧急</option><option value="3">P3 紧急不重要</option><option value="4">P4 不紧急不重要</option></select></div>
    </div>
    <div class="form-row full"><div><label>归属目标</label><select id="tGoal"><option value="">不关联目标</option></select></div></div>
    <div class="form-row" id="tStatusRow">
      <div><label>状态</label><select id="tStatus"><option value="todo">未开始</option><option value="doing">进行中</option><option value="done">已完成</option></select></div>
      <div><label>完成进度 <span id="tProgVal">0%</span></label><input type="range" id="tProg" min="0" max="100" step="5" value="0" style="padding:0"></div>
    </div>
    <div class="form-row">
      <div><label id="tStartLbl">开始日期</label><input type="date" id="tStart"></div>
      <div><label id="tEndLbl">截止日期</label><input type="date" id="tEnd"></div>
    </div>
    <div class="form-row">
      <div><label>重复周期</label><select id="tRecur"><option value="">不循环（单次任务）</option><option value="daily">每天重复</option><option value="workday">法定工作日（扣除节假日·含调休补班）</option><option value="weekly">每周固定几天</option><option value="monthly">每月固定一天</option></select></div>
      <div id="tRecurHintWrap"><label>&nbsp;</label><div class="recur-hint" id="tRecurHint"></div></div>
    </div>
    <div class="recur-days" id="tWeekdays" style="display:none"></div>
    <div class="form-row" id="tMonthlyRow" style="display:none">
      <div><label>每月几日</label><input type="number" id="tMday" min="1" max="31" step="1" value="1"></div>
      <div><label>&nbsp;</label><div class="recur-hint">当月没有该日（如 2 月的 30 日）按当月最后一天计</div></div>
    </div>
    <div class="form-row">
      <div><label>计划时间（分钟）</label><input type="number" id="tPlan" min="0" value="60"></div>
      <div><label>实际时间（分钟）</label><input type="number" id="tActual" min="0" value="0"></div>
    </div>
    <div class="form-row full"><div><label>备注</label><textarea id="tNote" rows="2" placeholder="补充说明、注意事项、参考资料…"></textarea></div></div>
    <div class="check-line">
      <label><input type="checkbox" id="tCourse"> 课程（按周几固定上课，与循环任务二选一）</label>
    </div>
    <div id="courseFields" style="display:none">
      <div class="form-row">
        <div><label>教室</label><input id="tRoom" placeholder="如：教三 201"></div>
        <div><label>老师</label><input id="tTeacher" placeholder="教师姓名"></div>
      </div>
      <div class="form-row">
        <div><label>上课日</label><select id="tDow"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="0">周日</option></select></div>
        <div><label>节次时间</label><input id="tTime" placeholder="如 08:00-09:40"></div>
      </div>
    </div>
    <div class="modal-acts">
      <button class="btn danger" id="tDelete">删除</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="tCopy">另存为副本</button>
        <button class="btn ghost" id="tCancel">取消</button>
        <button class="btn" id="tSave">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 目标编辑弹窗 -->
<div class="modal-mask" id="goalModal">
  <div class="modal" style="max-width:440px">
    <h3 id="gmTitle">新增目标</h3>
    <div class="form-row">
      <div><label>目标档位</label><select id="gLevel"></select></div>
      <div><label>目标描述</label><input id="gText" placeholder="如：简历初稿收到 3 份反馈"></div>
    </div>
    <div class="modal-acts">
      <button class="btn danger" id="gDelete">删除</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="gCancel">取消</button>
        <button class="btn" id="gSave">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="reviewModal">
  <div class="modal" style="max-width:440px">
    <h3 id="rmTitle">写每月复盘</h3>
    <div class="form-row">
      <div><label>月份（一月一篇，改同一月即覆盖）</label><input id="rvMonth" type="month"></div>
    </div>
    <div class="form-row full"><div><label>这个月做得怎样、下月怎么调</label><textarea id="rvText" rows="4" placeholder="例：交付比计划晚 4 天，卡在评审排期。下月把评审提前到周三。"></textarea></div></div>
    <div class="modal-acts">
      <button class="btn danger" id="rvDelete">删除</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="rvCancel">取消</button>
        <button class="btn" id="rvSave">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="undo-bar" id="undoBar"><span id="undoMsg"></span><button id="undoBtn">撤销</button></div>
<div class="undo-bar bulk-bar" id="bulkBar">
  <span id="bulkCount">已选 0 条</span>
  <label><input type="checkbox" id="bulkAll">全选</label>
  <button id="bulkDone">切换完成</button>
  <button id="bulkDel">删除</button>
  <button id="bulkExit" class="bulk-exit">退出</button>
</div>

<script type="module">
import("/src/main.js");
</script>
</body>
</html>
